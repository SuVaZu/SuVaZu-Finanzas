</style></head><body><header><div><h1>🦁 SuVaZu Finanzas</h1><small id="headDate"></small></div><button class="btn alt sm" onclick="openSettings()">⚙️ Respaldo</button></header><div style="max-width:650px;margin:10px auto 0;padding:0 16px"><button id="installApp" hidden class="btn sm" onclick="installApp()">📲 Instalar SuVaZu Finanzas</button></div><main id="view"></main><nav class="nav"><button id="nav-balance" onclick="navigate('balance')"><span class="symbol">◫</span>Balance Diario</button><button id="nav-gastos" onclick="navigate('gastos')"><span class="symbol">⇣</span>Gastos</button><button id="nav-deudas" onclick="navigate('deudas')"><span class="symbol">▤</span>Deudas</button></nav><div id="modal"></div><script>
const KEY='suvazu-finanzas-v01';const dateLocal=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const today=dateLocal();const money=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});const sum=(xs,k)=>xs.reduce((a,x)=>a+Number(k?k(x):x||0),0);const fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}):'Sin fecha';const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,7);
const categories={'Hogar':['Servicios','Renta','Otros del hogar'],'Comida':['Comida preparada','Despensa','Bebidas'],'Limpieza':['Casa','Higiene personal'],'SuVaZu':['Gasolina','Refacciones','Mantenimiento','Herramientas','Otros de trabajo'],'Otros':['Otros']};const accounts=['Monedas','Billetes','Débito','DiDi','Rappi','Uber','inDrive','Cuentas por cobrar'];const blank=()=>({expenses:[],debts:[],payments:[],cards:[],cardTx:[],closures:[],extraCategories:[],opening:{},dayIncome:[]});let db;try{db=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{db=blank()}if(!db.categoryConfig||typeof db.categoryConfig!=='object'||Array.isArray(db.categoryConfig)){db.categoryConfig=JSON.parse(JSON.stringify(categories));for(const c of db.extraCategories||[])if(!db.categoryConfig[c])db.categoryConfig[c]=['General'];}let tab='balance',day=today,month=today.slice(0,7);const gastoVisible={mes:false,ano:false};const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const isDay=(x,d=day)=>x.date===d;const lastClose=()=>db.closures.find(x=>x.date===day);const values=(o)=>sum(Object.values(o||{}));const appAccounts=['DiDi','Rappi','Uber','inDrive'];const liquidAccounts=['Monedas','Billetes','Débito'];const escapeAttr=s=>safe(s);
function navigate(t){tab=t;closeModal();render()}function render(){document.getElementById('headDate').textContent=new Date(day+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});for(const n of ['balance','gastos','deudas'])document.getElementById('nav-'+n).classList.toggle('active',n===tab);document.getElementById('view').innerHTML=tab==='balance'?balanceHTML():tab==='gastos'?gastosHTML():deudasHTML()}
function dayInput(){return `<div class="field"><label>Fecha de trabajo</label><input type="date" value="${day}" onchange="day=this.value;render()"></div>`}
function balanceHTML(){let c=lastClose(),ex=db.expenses.filter(x=>isDay(x)),inc=db.dayIncome.filter(x=>isDay(x));let expenses=sum(ex,x=>x.amount),income=sum(inc,x=>x.amount);let balance=income-expenses;let closing=c?.balances||{};let physical=sum(liquidAccounts.map(a=>closing[a]||0));let digital=sum(appAccounts.map(a=>closing[a]||0));let pending=Number(closing['Cuentas por cobrar']||0),reserved=Number(c?.reserved||0);return `<h2>Balance Diario</h2><div class="card">${dayInput()}<div class="notice">Durante el día solo registra gastos. Las ganancias y el dinero real se capturan al cierre, cuando haces el cuadre.</div><div class="grid"><div class="metric"><small>Gastos anotados</small><strong class="red">${money(expenses)}</strong></div><div class="metric"><small>Ganancias registradas</small><strong class="green">${money(income)}</strong></div></div><div class="spacer"></div><button class="btn alt" onclick="navigate('gastos')">+ Registrar gasto</button> <button class="btn" onclick="openIncome()">+ Ganancia SuVaZu</button></div>${c?`<div class="card"><div class="row"><h3>Cuadre del día</h3><span class="pill">${safe(c.date)}</span></div><div class="grid"><div class="metric"><small>Efectivo + débito</small><strong>${money(physical)}</strong></div><div class="metric"><small>Saldos en apps</small><strong>${money(digital)}</strong></div><div class="metric"><small>Cuentas por cobrar</small><strong>${money(pending)}</strong></div><div class="metric"><small>Apartado para deudas</small><strong>${money(reserved)}</strong></div></div><p class="muted">Dinero libre estimado (sin apps ni cuentas por cobrar): <b class="green">${money(physical-reserved)}</b></p><p class="muted">Movimientos del día (ganancias − gastos): <b>${money(balance)}</b>. Este resultado no equivale necesariamente al saldo físico.</p><button class="btn alt" onclick="openClosing()">Editar cierre del día</button></div>`:`<div class="card"><h3>Cuadre pendiente</h3><p class="muted">Al terminar tu jornada, registra cuánto tienes en monedas, billetes, débito y aplicaciones. El sistema guardará una fotografía de tus saldos del día.</p><button class="btn" onclick="openClosing()">Realizar cierre del día</button></div>`}<div class="card"><div class="row"><h3>Ganancias SuVaZu</h3><button class="btn alt sm" onclick="openIncome()">+ Añadir</button></div>${inc.length?inc.map(x=>`<div class="entry row"><div><strong>${safe(x.label||'Ganancia SuVaZu')}</strong><small>${safe(x.note||'')}</small></div><div class="right"><b class="green">${money(x.amount)}</b><br><button class="btn alt sm" onclick="removeItem('dayIncome','${x.id}')">Eliminar</button></div></div>`).join(''):'<p class="empty">Aún no has registrado ganancias para esta fecha.</p>'}</div><div class="card"><h3>Vista de saldos${c?' al cierre':''}</h3>${accounts.map(a=>`<div class="entry row"><span>${safe(a)}</span><b>${c?money(closing[a]):'—'}</b></div>`).join('')}<small>Los saldos en apps y las cuentas por cobrar no se consideran efectivo disponible hasta recibirlos.</small></div><div class="card"><h3>Historial de cierres</h3>${db.closures.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(x=>`<div class="entry row"><span>${fmt(x.date)}</span><button class="btn alt sm" onclick="day='${x.date}';render()">Ver cierre</button></div>`).join('')||'<p class="empty">Sin cierres todavía.</p>'}</div>`}
function gastosHTML(){
 const daily=db.expenses.filter(x=>x.date===day).slice().reverse();
 const monthly=db.expenses.filter(x=>x.date.startsWith(month));
 const year=month.slice(0,4);
 const annual=db.expenses.filter(x=>x.date.startsWith(year));
 const cats=Object.keys(db.categoryConfig);
 const catRows=(items)=>cats.map(c=>`<div class="entry row"><span>${safe(c)}</span><b>${money(sum(items.filter(x=>x.category===c),x=>x.amount))}</b></div>`).join('');
 return `<h2>Gastos</h2>
 <div class="card"><div class="row"><h3>Gastos del día</h3><button class="btn" onclick="openExpense()">+ Nuevo gasto</button></div>
 <div class="field"><label>Fecha a consultar</label><input type="date" value="${day}" onchange="day=this.value;render()"></div>
 <div class="metric" style="margin:12px 0"><small>Total del día</small><strong class="red big">${money(sum(daily,x=>x.amount))}</strong></div>
 <h3>Movimientos</h3>${daily.length?daily.map(x=>`<div class="entry row"><div><strong>${safe(x.category)} · ${safe(x.subcategory||'General')}</strong><small>${safe(x.note||'Sin descripción')}</small></div><div class="right"><b class="red">−${money(x.amount)}</b><br><button class="btn alt sm" onclick="removeItem('expenses','${x.id}')">Eliminar</button></div></div>`).join(''):'<p class="empty">No hay gastos registrados este día.</p>'}</div>
 <div class="card"><div class="row"><h3 style="margin:0">Gastos del mes</h3><b>${money(sum(monthly,x=>x.amount))}</b></div><button class="btn alt sm" style="width:100%;margin-top:12px" onclick="toggleGasto('mes')">${gastoVisible.mes?'Ocultar detalles ▲':'Mostrar detalles ▼'}</button>${gastoVisible.mes?`<div class="field" style="margin-top:12px"><label>Mes a consultar</label><input type="month" value="${month}" onchange="month=this.value;render()"></div><div style="margin-top:10px">${catRows(monthly)}</div>`:''}</div>
 <div class="card"><div class="row"><h3 style="margin:0">Gastos del año</h3><b>${money(sum(annual,x=>x.amount))}</b></div><button class="btn alt sm" style="width:100%;margin-top:12px" onclick="toggleGasto('ano')">${gastoVisible.ano?'Ocultar detalles ▲':'Mostrar detalles ▼'}</button>${gastoVisible.ano?`<div class="field" style="margin-top:12px"><label>Año a consultar</label><input type="number" min="2000" max="2100" step="1" value="${year}" onchange="month=this.value+'-01';render()"></div>${Array.from({length:12},(_,i)=>{let m=year+'-'+String(i+1).padStart(2,'0');let n=new Date(Number(year),i,1).toLocaleDateString('es-MX',{month:'long'});return `<div class="entry row"><span>${n}</span><b>${money(sum(annual.filter(x=>x.date.startsWith(m)),x=>x.amount))}</b></div>`}).join('')}<h3 style="margin-top:12px">Por categoría</h3>${catRows(annual)}`:''}</div>
 <div class="card"><button class="btn alt" style="width:100%" onclick="manageCategories()">⚙️ Administrar categorías</button></div>`;
}
function toggleGasto(section){gastoVisible[section]=!gastoVisible[section];render()}
function debtSchedule(d){return Array.isArray(d.schedule)?d.schedule:(d.next?[{id:'legacy-'+d.id,date:d.next,amount:0}]:[])}
function debtKind(d){return d.kind||(d.strategy==='Abonos periódicos'||d.strategy==='Liquidar después de otras deudas'?'abonos':'liquidar')}
function debtTotal(d){return debtKind(d)==='abonos'&&d.capital!==undefined?Number(d.capital||0):(debtSchedule(d).some(x=>Number(x.amount)>0)?sum(debtSchedule(d),x=>x.amount):Number(d.initial||0))}
function principalPaid(p){return p.capitalAmount!==undefined?Number(p.capitalAmount||0):Number(p.amount||0)}
function debtDue(d){return Math.max(0,debtTotal(d)+sum(db.payments.filter(p=>p.debtId===d.id),p=>Number(p.interest)||0)-sum(db.payments.filter(p=>p.debtId===d.id),principalPaid))}
function cardBalance(c){let xs=db.cardTx.filter(t=>t.cardId===c.id);return Math.max(0,Number(c.base||0)+sum(xs.filter(x=>x.type==='cargo'||x.type==='interes'),x=>x.amount)-sum(xs.filter(x=>x.type==='pago'),x=>x.amount))}
function monthBounds(baseDay=day){const [y,m]=baseDay.split('-').map(Number);const start=`${y}-${String(m).padStart(2,'0')}-01`;const end=m===12?`${y+1}-01-01`:`${y}-${String(m+1).padStart(2,'0')}-01`;return {start,end,label:new Date(start+'T12:00:00').toLocaleDateString('es-MX',{month:'long',year:'numeric'})}}
function monthOccurrences(d,start,end){if(debtKind(d)!=='abonos')return debtSchedule(d).filter(x=>x.date>=start&&x.date<end).map(x=>({date:x.date,amount:Number(x.amount||0)}));if(!d.recurringStart||!Number(d.recurringAmount))return debtSchedule(d).filter(x=>x.date>=start&&x.date<end).map(x=>({date:x.date,amount:Number(x.amount||0)}));let date=new Date(d.recurringStart+'T12:00:00Z'),finish=new Date(end+'T12:00:00Z'),result=[];if(Number.isNaN(date.getTime()))return result;const weekly=d.frequency!=='mensual';const origDay=date.getUTCDate();let guard=0;while(date<finish&&guard++<1800){const current=date.toISOString().slice(0,10);if(current>=start&&current<end)result.push({date:current,amount:Number(d.recurringAmount)});if(weekly)date.setUTCDate(date.getUTCDate()+7);else{let y=date.getUTCFullYear(),m=date.getUTCMonth()+1;if(m>11){m=0;y++}date=new Date(Date.UTC(y,m,Math.min(origDay,new Date(Date.UTC(y,m+1,0)).getUTCDate()),12))}}return result}
function balanceAt(d,t){return Math.max(0,debtTotal(d)+sum(db.payments.filter(p=>p.debtId===d.id&&p.date<t),p=>Number(p.interest||0))-sum(db.payments.filter(p=>p.debtId===d.id&&p.date<t),principalPaid))}
function debtMonthSummary(){const {start,end,label}=monthBounds();const ps=db.payments.filter(p=>p.date>=start&&p.date<end);const tx=db.cardTx.filter(x=>x.date>=start&&x.date<end);const scheduled=sum(db.debts,d=>sum(monthOccurrences(d,start,end),x=>x.amount));const cardPay=sum(tx.filter(x=>x.type==='pago'),x=>x.amount);const paid=sum(ps,p=>p.amount)+cardPay;const current=sum(db.debts,debtDue)+sum(db.cards,cardBalance);const monthPrincipal=sum(ps,principalPaid)+cardPay;const added=sum(tx.filter(x=>x.type==='cargo'||x.type==='interes'),x=>x.amount);const capitalAtStart=current+monthPrincipal-added+sum(ps,p=>-Number(p.interest||0));return {label,scheduled,paid,current,capitalAtStart,monthPrincipal,pending:Math.max(0,scheduled-sum(ps,p=>p.amount))}}
function highlightedDates(d){const {start,end}=monthBounds();return monthOccurrences(d,start,end)}
function paymentRows(d){const sc=debtKind(d)==='abonos'?monthOccurrences(d,...(b=>[b.start,b.end])(monthBounds())):debtSchedule(d);return sc.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>{const thisMonth=x.date.slice(0,7)===day.slice(0,7);return `<div class="entry row ${thisMonth?'current-pay':''}"><div><small>${fmt(x.date)}</small>${thisMonth?'<span class="current-label">Este mes</span>':''}</div><strong>${money(x.amount)}</strong></div>`}).join('')||'<p class="muted">Aún sin pagos programados.</p>'}
function debtCard(d){let paid=db.payments.filter(p=>p.debtId===d.id);return `<article class="debt-slide"><h3>${safe(d.name)}</h3><small>${debtKind(d)==='abonos'?'Abonos periódicos':'Liquidación programada'}</small><div class="debt-amount"><small>Capital pendiente</small><strong>${money(debtDue(d))}</strong></div><p class="muted">Capital registrado: ${money(debtTotal(d))}<br>Reducción acumulada: ${money(sum(paid,principalPaid))}</p><div class="debt-dates"><strong>${debtKind(d)==='abonos'?'Pagos de este mes':'Fechas de pago'}</strong>${paymentRows(d)}</div><div class="stack"><button class="btn sm" onclick="openPayment('${d.id}')">+ Registrar pago</button><button class="btn alt sm" onclick="showPayments('${d.id}')">Historial</button><button class="btn alt sm" onclick="openDebt('${d.id}')">Editar</button></div></article>`}
function deudasHTML(){const ms=debtMonthSummary(),periodic=db.debts.filter(d=>debtKind(d)==='abonos'),planned=db.debts.filter(d=>debtKind(d)!=='abonos');return `<h2>Deudas</h2><div class="card"><div class="row"><h3>Resumen de deudas</h3><span class="pill">${safe(ms.label)}</span></div><div class="grid"><div class="metric"><small>Deuda al iniciar el mes*</small><strong class="orange">${money(ms.capitalAtStart)}</strong></div><div class="metric"><small>Pagos programados del mes</small><strong>${money(ms.scheduled)}</strong></div><div class="metric"><small>Pagos realizados</small><strong class="green">${money(ms.paid)}</strong></div><div class="metric"><small>Capital pendiente</small><strong>${money(ms.current)}</strong></div></div><p class="muted">Pendiente de los pagos programados: <b>${money(ms.pending)}</b>. Incluye el capital registrado de tarjetas; sus vencimientos deben revisarse en cada tarjeta.</p><small>*Saldo reconstruido con los movimientos registrados; si agregas una deuda nueva o cambias importes, el histórico puede variar.</small></div><div class="card debt-panel"><div class="row"><h3>Abonos periódicos</h3><button class="btn sm" onclick="openDebt(null,'abonos')">+ Deuda</button></div><p class="debt-hint">Pagos semanales o mensuales, sin fecha de liquidación fija. Los refrendos no reducen capital.</p>${periodic.length?`<div class="debt-strip">${periodic.map(debtCard).join('')}</div>`:'<p class="empty">Añade aquí Banco Azteca y empeños con abonos periódicos.</p>'}</div><div class="card planned-panel"><div class="row"><h3>Liquidaciones programadas</h3><button class="btn sm" onclick="openDebt(null,'liquidar')">+ Deuda</button></div><p class="muted">Pagos con fechas e importes definidos para liquidar.</p>${planned.length?`<div class="debt-strip">${planned.map(debtCard).join('')}</div>`:'<p class="empty">Aún sin liquidaciones programadas.</p>'}</div><div class="card cards-panel"><div class="row"><h3>Tarjetas de crédito</h3><button class="btn sm" onclick="openCard()">+ Tarjeta</button></div><p class="muted">Reutilizar crédito sin intereses requiere cubrir el pago para no generar intereses antes de su fecha límite.</p>${db.cards.length?db.cards.map(c=>`<div class="entry"><div class="row"><strong>${safe(c.name)}</strong><b>${money(cardBalance(c))}</b></div><small>Corte: día ${safe(c.cut||'—')} · Pago: día ${safe(c.pay||'—')}</small><p class="muted">Saldo para no generar intereses (capturado): ${c.noInterest?money(c.noInterest):'Por registrar'} · Disponible según límite: ${c.limit?money(Math.max(0,Number(c.limit)-cardBalance(c))):'Sin límite registrado'}</p><div class="stack"><button class="btn sm" onclick="openCardTx('${c.id}')">+ Movimiento</button><button class="btn alt sm" onclick="showCardTx('${c.id}')">Historial</button><button class="btn alt sm" onclick="openCard('${c.id}')">Editar</button></div></div>`).join(''):'<p class="empty">Sin tarjetas registradas.</p>'}</div>`}

function modal(title,body){document.getElementById('modal').innerHTML=`<div class="dialog" onclick="if(event.target===this)closeModal()"><section class="sheet"><div class="row"><h2>${title}</h2><button class="btn alt sm" onclick="closeModal()">Cerrar ✕</button></div>${body}</section></div>`}function closeModal(){document.getElementById('modal').innerHTML=''}const field=(name,label,type='text',value='',extra='')=>`<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${escapeAttr(value)}" ${extra}></div>`;const choice=(name,label,opts,selected='')=>`<div class="field"><label>${label}</label><select name="${name}">${opts.map(x=>`<option value="${escapeAttr(x)}" ${selected===x?'selected':''}>${safe(x)}</option>`).join('')}</select></div>`;function valuesForm(form){return Object.fromEntries(new FormData(form).entries())}function formSave(id,fn){document.getElementById(id).addEventListener('submit',e=>{e.preventDefault();fn(valuesForm(e.currentTarget))})}
function categoryOptions(c){return db.categoryConfig[c]||[]}
function updateExpenseSubs(){const f=document.getElementById('expenseForm');if(!f)return;const sel=f.elements.subcategory;sel.innerHTML=categoryOptions(f.elements.category.value).map(x=>'<option value="'+escapeAttr(x)+'">'+safe(x)+'</option>').join('')}
function openExpense(){const cats=Object.keys(db.categoryConfig);if(!cats.length){alert('Primero agrega una categoría');manageCategories();return}modal('Registrar gasto',`<form id="expenseForm" class="form">${field('date','Fecha','date',day,'required')}${choice('category','Categoría',cats)}<div class="field"><label>Subcategoría</label><select name="subcategory"></select></div>${field('amount','Importe (MXN)','number','','min="0.01" step="0.01" required')}${field('note','Descripción (opcional)')}<button class="btn">Guardar gasto</button></form>`);const f=document.getElementById('expenseForm');f.elements.category.addEventListener('change',updateExpenseSubs);updateExpenseSubs();formSave('expenseForm',v=>{db.expenses.push({...v,id:uid(),amount:Number(v.amount)});save();closeModal();render()})}
function manageCategories(){modal('Administrar categorías',`<p class="muted">Agrega, edita o elimina categorías y subcategorías. Los gastos anteriores se conservan.</p><div class="stack"><button class="btn" onclick="newCategory()">+ Categoría</button></div>${Object.entries(db.categoryConfig).map(([c,subs])=>`<div class="card"><div class="row"><strong>${safe(c)}</strong><div class="stack"><button class="btn alt sm" onclick="renameCategory(decodeURIComponent('${encodeURIComponent(c)}'))">Editar</button><button class="btn warn sm" onclick="deleteCategory(decodeURIComponent('${encodeURIComponent(c)}'))">Eliminar</button></div></div><div class="stack" style="margin:12px 0"><button class="btn alt sm" onclick="newSub(decodeURIComponent('${encodeURIComponent(c)}'))">+ Subcategoría</button></div>${subs.map(sub=>`<div class="entry row"><span>${safe(sub)}</span><div class="stack"><button class="btn alt sm" onclick="renameSub(decodeURIComponent('${encodeURIComponent(c)}'),decodeURIComponent('${encodeURIComponent(sub)}'))">Editar</button><button class="btn warn sm" onclick="deleteSub(decodeURIComponent('${encodeURIComponent(c)}'),decodeURIComponent('${encodeURIComponent(sub)}'))">Eliminar</button></div></div>`).join('')}</div>`).join('')}`)}
function newCategory(){const n=prompt('Nombre de la categoría nueva:')?.trim();if(!n)return;if(db.categoryConfig[n])return alert('Ya existe esa categoría');db.categoryConfig[n]=['General'];save();manageCategories()}
function renameCategory(c){const n=prompt('Nuevo nombre de categoría:',c)?.trim();if(!n||n===c)return;if(db.categoryConfig[n])return alert('Ya existe esa categoría');const obj={};for(const [key,val] of Object.entries(db.categoryConfig))obj[key===c?n:key]=val;db.categoryConfig=obj;db.expenses.forEach(x=>{if(x.category===c)x.category=n});save();render();manageCategories()}
function deleteCategory(c){if(db.expenses.some(x=>x.category===c))return alert('Esta categoría tiene gastos registrados. Puedes renombrarla sin perder el historial. Para eliminarla, primero reasigna esos gastos.');if(!confirm('¿Eliminar categoría '+c+' y sus subcategorías?'))return;delete db.categoryConfig[c];save();render();manageCategories()}
function newSub(c){const n=prompt('Nueva subcategoría de '+c+':')?.trim();if(!n)return;if(categoryOptions(c).includes(n))return alert('Ya existe esta subcategoría');db.categoryConfig[c].push(n);save();manageCategories()}
function renameSub(c,sub){const n=prompt('Nuevo nombre de subcategoría:',sub)?.trim();if(!n||n===sub)return;if(categoryOptions(c).includes(n))return alert('Ya existe esta subcategoría');db.categoryConfig[c]=categoryOptions(c).map(x=>x===sub?n:x);db.expenses.forEach(x=>{if(x.category===c&&x.subcategory===sub)x.subcategory=n});save();render();manageCategories()}
function deleteSub(c,sub){if(db.expenses.some(x=>x.category===c&&x.subcategory===sub))return alert('Esta subcategoría tiene gastos registrados. Puedes renombrarla sin perderlos. Para eliminarla, primero reasigna esos gastos.');if(!confirm('¿Eliminar la subcategoría '+sub+'?'))return;db.categoryConfig[c]=categoryOptions(c).filter(x=>x!==sub);save();manageCategories()}
function openCategory(){newCategory()}
function openIncome(){modal('Ganancia de SuVaZu',`<form id="incomeForm" class="form">${field('date','Fecha','date',day,'required')}${choice('label','Origen',['Repartidor SuVaZu','DiDi','Rappi','Uber','inDrive','Propinas','Otro ingreso'])}${field('amount','Importe (MXN)','number','','min="0.01" step="0.01" required')}${field('note','Nota (opcional)')}<button class="btn">Guardar ganancia</button></form>`);formSave('incomeForm',v=>{db.dayIncome.push({...v,id:uid(),amount:Number(v.amount)});save();closeModal();render()})}
function openClosing(){let c=lastClose();modal('Cierre y cuadre diario',`<form id="closeForm" class="form"><p class="muted">Registra el saldo REAL de cada concepto al finalizar el día. El dinero pendiente no se suma al efectivo libre. Los saldos son una fotografía del cierre, no un cálculo automático.</p>${accounts.map(a=>field('a_'+accounts.indexOf(a),a+' (MXN)','number',c?.balances?.[a]??0,'min="0" step="0.01" required')).join('')}${field('reserved','Dinero apartado para deudas (incluido en efectivo o débito)','number',c?.reserved||0,'min="0" step="0.01" required')}${field('notes','Observaciones','text',c?.notes||'')}<button class="btn">Guardar cierre</button></form>`);formSave('closeForm',v=>{let balances={};accounts.forEach((a,i)=>balances[a]=Number(v['a_'+i]||0));let obj={date:day,balances,reserved:Number(v.reserved||0),notes:v.notes};db.closures=db.closures.filter(x=>x.date!==day);db.closures.push(obj);save();closeModal();render()})}
function updateScheduleTotal(){const rows=[...document.querySelectorAll('#scheduleRows .entry')];const total=rows.reduce((n,r)=>n+Math.max(0,Number(r.querySelector('.sched-amount').value)||0),0);const label=document.getElementById('scheduleTotal');if(label)label.textContent=money(total);}
function addScheduleRow(date='',amount=''){const root=document.getElementById('scheduleRows');const id='sched'+uid().replace(/[^a-zA-Z0-9]/g,'');const row=document.createElement('div');row.className='entry';row.id=id;row.innerHTML=`<div class="row"><div class="field" style="flex:1"><label>Fecha</label><input aria-label="Fecha de pago" type="date" class="sched-date" value="${escapeAttr(date)}" required></div><div class="field" style="flex:1"><label>Importe (MXN)</label><input aria-label="Importe programado" type="number" min="0.01" step="0.01" class="sched-amount" value="${escapeAttr(amount)}" oninput="updateScheduleTotal()" required></div><button type="button" class="btn warn sm" aria-label="Quitar fecha" onclick="document.getElementById('${id}').remove();updateScheduleTotal()">✕</button></div>`;root.appendChild(row);updateScheduleTotal()}
function openDebt(id,kindDefault='liquidar'){let d=db.debts.find(x=>x.id===id)||{};const kind=id?debtKind(d):kindDefault;modal(id?'Editar deuda':'Añadir deuda',`<form id="debtForm" class="form">${field('name','Acreedor / nombre','text',d.name||'','required')}<div class="field"><label>Tipo de deuda</label><select name="kind" id="debtKind"><option value="abonos" ${kind==='abonos'?'selected':''}>Abonos periódicos (sin fecha de liquidación)</option><option value="liquidar" ${kind==='liquidar'?'selected':''}>Liquidación programada</option></select></div><div id="periodicFields"><p class="muted">Registra el capital adeudado. Los pagos periódicos pueden ser solo refrendo, pago normal o abono adicional a capital.</p>${field('capital','Capital pendiente de referencia (MXN)','number',d.capital??d.initial??'','min="0" step="0.01"')}<div class="field"><label>Frecuencia</label><select name="frequency">${['semanal','mensual'].map(x=>`<option value="${x}" ${d.frequency===x?'selected':''}>${x==='semanal'?'Semanal':'Mensual'}</option>`).join('')}</select></div>${field('recurringStart','Primera fecha de pago','date',d.recurringStart||'')}${field('recurringAmount','Importe por pago (MXN)','number',d.recurringAmount??'','min="0" step="0.01"')}<small>Los pagos periódicos se calculan a partir de la primera fecha; puedes registrar pagos adicionales a capital al momento de pagar.</small></div><div id="plannedFields"><div class="card"><h3>Fechas de pago</h3><div id="scheduleRows"></div><button type="button" class="btn alt" onclick="addScheduleRow()">+ Añadir fecha e importe</button><div class="metric" style="margin-top:12px"><small>Deuda total</small><strong id="scheduleTotal">$0.00</strong></div></div></div><button class="btn">Guardar deuda</button></form>${id?`<p><button class="btn warn sm" onclick="deleteDebt('${id}')">Eliminar deuda y pagos</button></p>`:''}`);let f=document.getElementById('debtForm');const toggle=()=>{let periodic=f.elements.kind.value==='abonos';document.getElementById('periodicFields').hidden=!periodic;document.getElementById('plannedFields').hidden=periodic;for(const i of document.querySelectorAll('#scheduleRows input'))i.required=!periodic;f.elements.capital.required=periodic;f.elements.recurringStart.required=periodic;f.elements.recurringAmount.required=periodic};f.elements.kind.addEventListener('change',toggle);debtSchedule(d).filter(x=>Number(x.amount)>0).forEach(x=>addScheduleRow(x.date,Number(x.amount)));if(!document.querySelector('#scheduleRows .entry'))addScheduleRow();toggle();formSave('debtForm',v=>{const periodic=v.kind==='abonos';const rows=[...document.querySelectorAll('#scheduleRows .entry')];const schedule=rows.map(r=>({id:uid(),date:r.querySelector('.sched-date').value,amount:Number(r.querySelector('.sched-amount').value)}));if(!periodic&&(!schedule.length||schedule.some(x=>!x.date||x.amount<=0)))return alert('Agrega fechas e importes correctos');if(periodic&&(!v.recurringStart||Number(v.recurringAmount)<=0||Number(v.capital)<0))return alert('Revisa capital, primera fecha e importe recurrente');const o={name:v.name.trim(),kind:v.kind,capital:periodic?Number(v.capital):undefined,initial:periodic?Number(v.capital):sum(schedule,x=>x.amount),schedule:periodic?[]:schedule,frequency:periodic?v.frequency:undefined,recurringStart:periodic?v.recurringStart:undefined,recurringAmount:periodic?Number(v.recurringAmount):undefined,deadline:''};if(id)Object.assign(d,o);else db.debts.push({...o,id:uid()});save();closeModal();render()})}
function openPayment(id){const d=db.debts.find(x=>x.id===id);const periodic=debtKind(d)==='abonos';modal('Registrar pago',`<form id="paymentForm" class="form">${field('date','Fecha del pago','date',day,'required')}${field('amount','Cantidad pagada (MXN)','number','','min="0.01" step="0.01" required')}${periodic?`<div class="field"><label>Tipo de pago</label><select name="paymentType"><option value="normal">Abono semanal/mensual (sin reducción de capital)</option><option value="capital">Abono a capital</option><option value="refrendo">Refrendo (no disminuye capital)</option><option value="mixto">Pago periódico con parte a capital</option></select></div>${field('capitalAmount','De este pago, ¿cuánto va a capital?','number',0,'min="0" step="0.01"')}<small>Para abono a capital registra la cantidad que reduce la deuda; en refrendos usa cero.</small>`:''}<button class="btn">Guardar pago</button></form>`);formSave('paymentForm',v=>{const amount=Number(v.amount);const cap=periodic?(v.paymentType==='refrendo'||v.paymentType==='normal'?0:v.paymentType==='capital'?amount:Number(v.capitalAmount||0)):amount;if(cap<0||cap>amount)return alert('El abono a capital no puede superar lo pagado');db.payments.push({id:uid(),debtId:id,date:v.date,amount,capitalAmount:cap,paymentType:periodic?v.paymentType:'liquidacion',interest:0});save();closeModal();render()})}
function showPayments(id){const d=db.debts.find(x=>x.id===id);let bal=debtTotal(d);let ps=db.payments.filter(p=>p.debtId===id).sort((a,b)=>a.date.localeCompare(b.date));modal('Pagos: '+safe(d.name),`<p>Capital original: <b>${money(bal)}</b></p>${ps.map(p=>{bal-=principalPaid(p);return `<div class="entry"><div class="row"><span>${fmt(p.date)} · Pagado ${money(p.amount)}</span><b>Capital restante ${money(Math.max(0,bal))}</b></div><small>Aplicado a capital: ${money(principalPaid(p))}</small><button class="btn warn sm" onclick="removeItem('payments','${p.id}')">Eliminar pago</button></div>`}).join('')||'<p class="empty">Sin pagos registrados.</p>'}`)}

function deleteDebt(id){if(!confirm('¿Eliminar esta deuda y TODOS sus pagos?'))return;db.debts=db.debts.filter(x=>x.id!==id);db.payments=db.payments.filter(x=>x.debtId!==id);save();closeModal();render()}
function openCard(id){let c=db.cards.find(x=>x.id===id)||{};modal(id?'Editar tarjeta':'Nueva tarjeta',`<form id="cardForm" class="form">${field('name','Nombre de la tarjeta','text',c.name||'','required')}${field('cut','Día de corte (1–31)','number',c.cut||'','min="1" max="31"')}${field('pay','Día límite de pago (1–31)','number',c.pay||'','min="1" max="31"')}${field('base','Capital inicial registrado (MXN)','number',c.base??'','min="0" step="0.01" required')}${field('noInterest','Pago para no generar intereses (según estado de cuenta)','number',c.noInterest??'','min="0" step="0.01"')}${field('limit','Límite de crédito (opcional)','number',c.limit??'','min="0" step="0.01"')}<button class="btn">Guardar tarjeta</button></form>${id?`<p><button class="btn warn sm" onclick="deleteCard('${id}')">Eliminar tarjeta y movimientos</button></p>`:''}`);formSave('cardForm',v=>{let o={...v,base:Number(v.base),noInterest:v.noInterest===''?'':Number(v.noInterest),limit:v.limit===''?'':Number(v.limit),reported:c.reported??''};if(id)Object.assign(c,o);else db.cards.push({...o,id:uid()});save();closeModal();render()})}

function openCardTx(id){modal('Movimiento de tarjeta',`<form id="txForm" class="form">${field('date','Fecha','date',day,'required')}${choice('type','Tipo de movimiento',['cargo','interes','pago'])}${field('amount','Importe (MXN)','number','','min="0.01" step="0.01" required')}${field('note','Concepto / referencia','text')}<button class="btn">Guardar movimiento</button></form>`);formSave('txForm',v=>{db.cardTx.push({...v,id:uid(),cardId:id,amount:Number(v.amount)});save();closeModal();render()})}
function showCardTx(id){let c=db.cards.find(x=>x.id===id),xs=db.cardTx.filter(t=>t.cardId===id).sort((a,b)=>a.date.localeCompare(b.date));modal('Movimientos: '+safe(c.name),xs.map(x=>`<div class="entry row"><div><strong>${safe(x.type)} · ${money(x.amount)}</strong><small>${fmt(x.date)} · ${safe(x.note||'')}</small></div><button class="btn warn sm" onclick="removeItem('cardTx','${x.id}')">Eliminar</button></div>`).join('')||'<p class="empty">No hay movimientos.</p>')}
function deleteCard(id){if(!confirm('¿Eliminar tarjeta y todos sus movimientos?'))return;db.cards=db.cards.filter(x=>x.id!==id);db.cardTx=db.cardTx.filter(x=>x.cardId!==id);save();closeModal();render()}
function removeItem(group,id){if(!confirm('¿Eliminar este registro?'))return;db[group]=db[group].filter(x=>x.id!==id);save();closeModal();render()}
function openSettings(){modal('Respaldo de tus registros',`<p>Los datos se guardan solamente en este navegador. Si borras sus datos, puedes perder tus registros. Exporta respaldos con frecuencia.</p><div class="stack"><button class="btn" onclick="exportData()">Descargar respaldo JSON</button><label class="btn alt">Importar respaldo <input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></label></div><p class="notice">Importar reemplaza TODOS los registros actuales. No hay sincronización entre dispositivos.</p><small>SuVaZu Finanzas · PWA v0.9</small>`)}function exportData(){let a=document.createElement('a');let url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download='SuVaZu-Finanzas-Respaldo-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(ev){let f=ev.target.files?.[0];if(!f)return;f.text().then(t=>{let x=JSON.parse(t);if(!x||!Array.isArray(x.expenses)||!Array.isArray(x.debts)||!Array.isArray(x.closures))throw new Error('Formato incorrecto');if(!confirm('¿Reemplazar todos los datos existentes con este respaldo?'))return;db=Object.assign(blank(),x);save();closeModal();render()}).catch(e=>alert('No se pudo importar: '+e.message))}render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(e => console.warn('Sin servicio offline',e)));
}
let installEvent;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;let b=document.getElementById('installApp');if(b)b.hidden=false;});
window.addEventListener('appinstalled',()=>{installEvent=null;let b=document.getElementById('installApp');if(b)b.hidden=true;});
async function installApp(){if(!installEvent){alert('En Chrome, abre el menú ⋮ y elige «Instalar aplicación» o «Añadir a pantalla principal».');return;}let evt=installEvent;installEvent=null;await evt.prompt();let b=document.getElementById('installApp');if(b)b.hidden=true;}
</script></body></html>
